# CI: the merge gate for main.
#
# Runs on pull requests into main and on pushes to release/** branches. It does not build the
# add-in: the DLL compiles against EPDM.Interop.epdm.dll from the SOLIDWORKS PDM client install,
# which a GitHub-hosted runner does not have and which is not ours to redistribute. Building and
# the manual test stay on a developer machine (see docs/RELEASE.md). What a runner can check
# without it: no secrets in the history, every tracked .cs file is compiled (the legacy csproj
# lists files explicitly, a forgotten <Compile> item only shows up in a local build), and a
# release branch is releasable. Every pull request runs, documentation-only ones included: these
# jobs are required status checks, and a check a path filter never starts stays "pending" and
# blocks the merge. This never publishes anything (see release.yml for that).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: ["release/**"]

# Least privilege: this workflow only reads the repo.
permissions:
  contents: read

# A newer run on the same PR or branch supersedes the one still in flight.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Secret scan over the full history of the checked-out ref. Runs the pinned release binary
  # directly, its checksum verified, instead of gitleaks-action.
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "$archive" gitleaks

      - name: Scan
        run: ./gitleaks git --redact --no-banner --verbose .

  # The csproj enumerates its sources. A tracked .cs file without a <Compile> item is silently
  # left out of the DLL, and an item without a tracked file breaks the build on a clean checkout.
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Compare tracked .cs files with the csproj's Compile items
        run: |
          git ls-files '*.cs' | sort > tracked.txt
          grep -oP '<Compile Include="\K[^"]+(?=")' GladosPdmAddin.csproj | tr '\\' '/' | sort > compiled.txt
          if ! diff -u --label tracked tracked.txt --label compiled compiled.txt; then
            echo "::error::GladosPdmAddin.csproj and the tracked .cs files differ (lines with - are not compiled, lines with + are not tracked)."
            exit 1
          fi

  # Runs only for release branches, on their pushes and on their PR into main: the branch name
  # must match the version in AssemblyInfo.cs, CHANGELOG.md needs the section, the tag must
  # still be free, mlAddInVersion must be above the previous release's, and the branch must
  # contain the current main so the DLL tested from it is exactly what the merge will tag.
  # Skipped elsewhere, which counts as passing for the required check.
  release-check:
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')) ||
      (github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The branch head itself, not the PR merge ref, which always contains main and would
          # hide an outdated branch. Full history for the previous release tag.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Check release branch
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if [[ ! "$BRANCH" =~ ^release/([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Release branch '$BRANCH' does not match release/X.Y.Z"
            exit 1
          fi
          pwsh -NoProfile -File scripts/Test-ReleaseVersion.ps1 -Version "${BASH_REMATCH[1]}"
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "::error::$BRANCH does not contain the current main, update it from main first."
            exit 1
          fi
